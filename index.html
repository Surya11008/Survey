    function getGroupType(ag) {
      if (!ag) return 'age_group';
      if (ag.groupType === 'other' || ag.groupType === 'age_group') return ag.groupType;
      const lower = (ag.label || '').toLowerCase();
      if (lower.includes('other') || lower.includes('guest') || lower.includes('visitor')) return 'other';

    }

    function getGrandTotalGroupIds() {
      if (Array.isArray(state.grandTotalGroupIds) && state.grandTotalGroupIds.length > 0) {
        const valid = state.grandTotalGroupIds.filter(id => state.ageGroups.some(ag => ag.id === id));
        if (valid.length > 0) return valid;
      }
      return state.ageGroups.map(ag => ag.id);
    }

    // ============================================================================
    // TWO-WAY DATA RECONCILIATION & DATA LOSS PREVENTION
    // ============================================================================
    function reconcileLists(localList = [], remoteList = [], deletedIds = [], keyFn = item => item?.id) {
      const mergedMap = new Map();
      const delSet = new Set(Array.isArray(deletedIds) ? deletedIds : []);

      // 1. Process local items (preserve items not deleted)
      if (Array.isArray(localList)) {
        for (const item of localList) {
          if (!item) continue;
          const key = keyFn(item);
          if (!key || delSet.has(key)) continue;
          mergedMap.set(key, item);
        }
      }

      // 2. Process remote items
      if (Array.isArray(remoteList)) {
        for (const item of remoteList) {
          if (!item) continue;
          const key = keyFn(item);
          if (!key || delSet.has(key)) continue;

          if (!mergedMap.has(key)) {
            mergedMap.set(key, item);
          } else {
            const localItem = mergedMap.get(key);
            const localTime = new Date(localItem.updatedAt || localItem.createdAt || 0).getTime() || 0;
            const remoteTime = new Date(item.updatedAt || item.createdAt || 0).getTime() || 0;
            if (remoteTime > localTime) {
              mergedMap.set(key, item);
            }
          }
        }
      }

      return Array.from(mergedMap.values());
    }

    function reconcileWithRemote(data) {
      if (!data || typeof data !== 'object') return;

      const remoteDelCats = Array.isArray(data.deletedCategoryIds) ? data.deletedCategoryIds : [];
      const remoteDelEntries = Array.isArray(data.deletedEntryIds) ? data.deletedEntryIds : [];
      const remoteDelZions = Array.isArray(data.deletedZionIds) ? data.deletedZionIds : [];
      const remoteDelAgs = Array.isArray(data.deletedAgIds) ? data.deletedAgIds : [];

      state.deletedCategoryIds = Array.from(new Set([...(state.deletedCategoryIds || []), ...remoteDelCats])).slice(-300);
      state.deletedEntryIds = Array.from(new Set([...(state.deletedEntryIds || []), ...remoteDelEntries])).slice(-500);
      state.deletedZionIds = Array.from(new Set([...(state.deletedZionIds || []), ...remoteDelZions])).slice(-200);
      state.deletedAgIds = Array.from(new Set([...(state.deletedAgIds || []), ...remoteDelAgs])).slice(-200);

      const remoteCats = Array.isArray(data.categories) ? data.categories : [];
      const mergedCats = reconcileLists(state.categories, remoteCats, state.deletedCategoryIds);
      state.categories = ensureDefaultCategories(mergedCats, state.deletedCategoryIds);

      const remoteZions = Array.isArray(data.zions) ? data.zions : [];
      const mergedZions = reconcileLists(state.zions, remoteZions, state.deletedZionIds);
      state.zions = mergedZions.length ? mergedZions : [...INITIAL_ZIONS];

      const remoteAgs = Array.isArray(data.ageGroups) ? data.ageGroups : [];
      const mergedAgs = reconcileLists(state.ageGroups, remoteAgs, state.deletedAgIds);
      state.ageGroups = mergedAgs.length ? mergedAgs : [...INITIAL_AGE_GROUPS];

      const remoteEntries = Array.isArray(data.entries) ? data.entries : [];
      const mergedEntries = reconcileLists(state.entries, remoteEntries, state.deletedEntryIds);
      mergedEntries.sort((a, b) => {
        const d1 = a.date || '';
        const d2 = b.date || '';
        if (d1 !== d2) return d2.localeCompare(d1);
        const t1 = new Date(a.updatedAt || a.createdAt || 0).getTime() || 0;
        const t2 = new Date(b.updatedAt || b.createdAt || 0).getTime() || 0;
        return t2 - t1;
      });
      state.entries = mergedEntries;

      if (Array.isArray(data.grandTotalGroupIds) && data.grandTotalGroupIds.length) {
        state.grandTotalGroupIds = data.grandTotalGroupIds;
      }

      saveLocalStateOnly();

      // If local has entries or categories not present in remote, sync immediately to update cloud
      const hasLocalNewEntries = state.entries.length > remoteEntries.length || state.entries.some(e => !remoteEntries.some(re => re.id === e.id));
      const hasLocalNewCats = state.categories.length > remoteCats.length || state.categories.some(c => !remoteCats.some(rc => rc.id === c.id));
      if (hasLocalNewEntries || hasLocalNewCats) {
        if (typeof window.syncToCloud === 'function') {
          window.syncToCloud(true);
        }
      }
    }

    function saveLocalStateOnly() {
      const payload = {
        categories: state.categories,
        zions: state.zions,
        ageGroups: state.ageGroups,
        entries: state.entries,
        grandTotalGroupIds: state.grandTotalGroupIds,
        deletedCategoryIds: (state.deletedCategoryIds || []).slice(-300),
        deletedEntryIds: (state.deletedEntryIds || []).slice(-500),
        deletedZionIds: (state.deletedZionIds || []).slice(-200),
        deletedAgIds: (state.deletedAgIds || []).slice(-200),
        savedAt: new Date().toISOString()
      };
      const jsonStr = JSON.stringify(payload);
      try {
        localStorage.setItem(STORAGE_KEY, jsonStr);
        localStorage.setItem(BACKUP_STORAGE_KEY, jsonStr);
        try {
          const snapRaw = localStorage.getItem(SNAPSHOTS_KEY);
          let snaps = snapRaw ? JSON.parse(snapRaw) : [];
          if (!Array.isArray(snaps)) snaps = [];
          snaps.unshift({ timestamp: Date.now(), data: payload });
          if (snaps.length > 5) snaps = snaps.slice(0, 5);
          localStorage.setItem(SNAPSHOTS_KEY, JSON.stringify(snaps));
        } catch (e) {}
      } catch (e) {
        console.warn('Unable to persist local state', e);
      }
    }

    function saveState(immediateSync = false) {
      saveLocalStateOnly();
      if (typeof window.syncToCloud === 'function') {
        window.syncToCloud(immediateSync);
      }
    }

    function loadState() {
      try {
        let raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem(LEGACY_STORAGE_KEY);
        let parsed = null;
        if (raw) {
          try { parsed = JSON.parse(raw); } catch (e) {}
        }
        let backupParsed = null;
        try {
          const backupRaw = localStorage.getItem(BACKUP_STORAGE_KEY);
          if (backupRaw) backupParsed = JSON.parse(backupRaw);
        } catch (e) {}

        if (backupParsed) {
          if (!parsed) {
            parsed = backupParsed;
          } else {
            const delEntrySet = new Set(parsed.deletedEntryIds || []);
            const combinedEntries = reconcileLists(parsed.entries || [], backupParsed.entries || [], delEntrySet);
            parsed.entries = combinedEntries;
          }
        }

        if (parsed) {
          state.deletedCategoryIds = Array.isArray(parsed.deletedCategoryIds) ? parsed.deletedCategoryIds : [];
          state.deletedEntryIds = Array.isArray(parsed.deletedEntryIds) ? parsed.deletedEntryIds : [];
          state.deletedZionIds = Array.isArray(parsed.deletedZionIds) ? parsed.deletedZionIds : [];
          state.deletedAgIds = Array.isArray(parsed.deletedAgIds) ? parsed.deletedAgIds : [];

          if (Array.isArray(parsed.categories) && parsed.categories.length) {
            state.categories = ensureDefaultCategories(parsed.categories, state.deletedCategoryIds);
          } else {
            state.categories = ensureDefaultCategories([...INITIAL_CATEGORIES], state.deletedCategoryIds);
          }
          if (Array.isArray(parsed.zions) && parsed.zions.length) state.zions = parsed.zions;
          if (Array.isArray(parsed.ageGroups) && parsed.ageGroups.length) state.ageGroups = parsed.ageGroups;
          if (Array.isArray(parsed.entries)) state.entries = parsed.entries;
          if (Array.isArray(parsed.grandTotalGroupIds)) state.grandTotalGroupIds = parsed.grandTotalGroupIds;
        } else {
          state.categories = ensureDefaultCategories([...INITIAL_CATEGORIES], []);
        }

        try {
          const savedView = localStorage.getItem('zion_survey_home_view');
          if (savedView === 'list' || savedView === 'grid') {
            state.homeView = savedView;
          }
          const savedAdmin = localStorage.getItem(ADMIN_SESSION_KEY);
          if (savedAdmin === 'true') {
            state.isAdmin = true;
          }
        } catch (e) {}
      } catch (e) {
        console.warn('Unable to load saved state', e);
      }
    }

    // Backup & Export / Restore Helpers
    function exportDataBackup() {
      const data = {
        app: 'Zion Survey & Attendance Manager',
        version: '1.0',
        exportedAt: new Date().toISOString(),
        categories: state.categories,
        zions: state.zions,
        ageGroups: state.ageGroups,
        entries: state.entries,
        grandTotalGroupIds: state.grandTotalGroupIds,
        deletedCategoryIds: state.deletedCategoryIds,
        deletedEntryIds: state.deletedEntryIds
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const dStr = new Date().toISOString().slice(0, 10);
      a.href = url;
      a.download = `zion_survey_backup_${dStr}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('Backup file downloaded');
    }

      const input = document.getElementById('backup-file-input');
      if (input) input.click();

    function handleBackupFileSelected(event) {
      const file = event.target?.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const parsed = JSON.parse(e.target.result);
          if (!parsed || (!Array.isArray(parsed.categories) && !Array.isArray(parsed.entries))) {
            showToast('Invalid backup file format');
            return;
          }
          openConfirmModal(
            'Restore Backup Data?',
            `This backup contains ${parsed.categories?.length || 0} categories and ${parsed.entries?.length || 0} survey entries. Merge this data with your current records?`,
            () => {
              if (Array.isArray(parsed.categories)) {
                state.categories = ensureDefaultCategories(reconcileLists(state.categories, parsed.categories, state.deletedCategoryIds), state.deletedCategoryIds);
              }
              if (Array.isArray(parsed.zions) && parsed.zions.length) {
                state.zions = reconcileLists(state.zions, parsed.zions, state.deletedZionIds);
              }
              if (Array.isArray(parsed.ageGroups) && parsed.ageGroups.length) {
                state.ageGroups = reconcileLists(state.ageGroups, parsed.ageGroups, state.deletedAgIds);
              }
              if (Array.isArray(parsed.entries)) {
                state.entries = reconcileLists(state.entries, parsed.entries, state.deletedEntryIds);
              }
              if (Array.isArray(parsed.grandTotalGroupIds)) {
                state.grandTotalGroupIds = parsed.grandTotalGroupIds;
              }
              saveState(true);
              closeModal();
              render();
              showToast('Data restored and synced successfully');
            }
          );
        } catch (err) {
          console.error(err);
          showToast('Error reading backup file');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function inferGenderFromLabel(label = '') {
      const lower = label.toLowerCase();
      if (lower.includes('female') || lower.includes('women') || lower.includes('girl') || lower.includes('sister')) return 'female';
      if (lower.includes('male') || lower.includes('men') || lower.includes('boy') || lower.includes('brother')) return 'male';
      return 'other';
    }

    function getEntryGenderStats(entry, customGroupIds = null) {
      let maleTotal = 0;
      let femaleTotal = 0;
      let grandTotal = 0;
      const counts = entry?.counts || {};
      const targetGroupIds = customGroupIds || getGrandTotalGroupIds();

      state.ageGroups.forEach(ag => {
        const val = Number(counts[ag.id]) || 0;
        if (targetGroupIds.includes(ag.id)) {
          grandTotal += val;
        }
        const gender = ag.gender || inferGenderFromLabel(ag.label);
        if (gender === 'male') maleTotal += val;
        else if (gender === 'female') femaleTotal += val;
      });

      return { maleTotal, femaleTotal, grandTotal };
    }

    function buildShareUrl(categoryId) {
      const base = window.location.href.split('#')[0];
      return `${base}#/survey/${encodeURIComponent(categoryId)}`;

    function copyTextToClipboard(text, successMsg) {
      try {
        const tempInput = document.createElement('textarea');
        tempInput.value = text;
        tempInput.style.position = 'fixed';
        tempInput.style.opacity = '0';
        document.body.appendChild(tempInput);
        tempInput.select();
        document.execCommand('copy');
        document.body.removeChild(tempInput);
        showToast(successMsg || 'Copied to clipboard!');
      } catch (e) {
        showToast(`Link: ${text}`);
      }
    }

    function showToast(message) {
      const root = document.getElementById('toast-root');
      root.innerHTML = `
        <div class="flex items-center gap-2.5 px-4 py-3 rounded-xl bg-slate-900 text-white text-xs sm:text-sm font-semibold shadow-xl border border-slate-700 animate-fade-in">
          <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-400 shrink-0"></i>
          <span>${escapeHtml(message)}</span>

      `;
      lucide.createIcons();
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => { root.innerHTML = ''; }, 3000);
    }

        const exists = state.categories.find(c => c.id === catId);
        if (exists) {
          state.selectedCategoryId = catId;

                </button>
              `}
            </div>
          </div>

          ${state.homeView === 'list' ? renderHomeListView() : cardsHtml}
        </div>
      `;
    }

    // ============================================================================
    // 2. DEDICATED CATEGORY DASHBOARD VIEW
    // ============================================================================
    function matchesCustomRule(entry, rule) {
      if (!rule.enabled) return true;
      const stats = getEntryGenderStats(entry);
      const zionName = state.zions.find(z => z.id === entry.zionId)?.name || '';

      if (rule.field === 'zion') {
        const target = String(rule.value || '').toLowerCase();
        if (rule.operator === 'equals') return entry.zionId === rule.value || zionName.toLowerCase() === target;
        if (rule.operator === 'not_equals') return entry.zionId !== rule.value && zionName.toLowerCase() !== target;
        return zionName.toLowerCase().includes(target);
      }

      if (rule.field === 'notes') {
        const hay = `${entry.notes || ''} ${zionName}`.toLowerCase();
        const needle = String(rule.value || '').toLowerCase();
        if (rule.operator === 'not_contains') return !hay.includes(needle);
        return hay.includes(needle);
      }

      let metricVal = 0;
      if (rule.field === 'maleTotal') metricVal = stats.maleTotal;
      else if (rule.field === 'femaleTotal') metricVal = stats.femaleTotal;
      else if (rule.field === 'grandTotal') metricVal = stats.grandTotal;
      else metricVal = Number(entry.counts?.[rule.field]) || 0;

      const threshold = Number(rule.value) || 0;
      switch (rule.operator) {
        case '>=': return metricVal >= threshold;
        case '<=': return metricVal <= threshold;
        case '>': return metricVal > threshold;
        case '<': return metricVal < threshold;
        case '==': return metricVal === threshold;
        default: return true;
      }
    }

    function getFilteredCategoryEntries(catId) {
      const f = state.filters;
      return state.entries.filter(entry => {
        if (entry.categoryId !== catId) return false;
        if (f.zion !== 'all' && entry.zionId !== f.zion) return false;
        if (f.dateFrom && entry.date < f.dateFrom) return false;
        if (f.dateTo && entry.date > f.dateTo) return false;
        if (f.search.trim()) {
          const q = f.search.toLowerCase();
          const zionName = (state.zions.find(z => z.id === entry.zionId)?.name || '').toLowerCase();
          const notes = (entry.notes || '').toLowerCase();
          if (!zionName.includes(q) && !notes.includes(q) && !entry.date.includes(q)) return false;
        }
        for (const rule of f.customRules) {
          if (!matchesCustomRule(entry, rule)) return false;
        }
        return true;
      });
    }

    function getRuleFieldLabel(field) {
      if (field === 'maleTotal') return 'Male Total';
      if (field === 'femaleTotal') return 'Female Total';
      if (field === 'grandTotal') return 'Grand Total';
      if (field === 'zion') return 'Zion';
      if (field === 'notes') return 'Search / Remarks';
      return state.ageGroups.find(ag => ag.id === field)?.label || field;
    }

    function formatRuleDisplayValue(rule) {
      if (rule.field === 'zion') {
        return state.zions.find(z => z.id === rule.value)?.name || rule.value;
      }
      return rule.value;
    }

      if (!checkAdminPermission('add a new Zion')) return;
      const input = document.getElementById('pub-new-zion-input');

      const now = new Date().toISOString();
      const newZ = { id: `zion-${Date.now()}`, name: trimmed, createdAt: now, updatedAt: now };
      state.zions.push(newZ);
      saveState(true);
      const select = document.getElementById('pub-zion-select');
      const opt = document.createElement('option');
      opt.value = newZ.id;
      opt.textContent = newZ.name;
      opt.selected = true;

    function updatePublicLiveTotals() {
      const counts = {};
      document.querySelectorAll('.pub-ag-input').forEach(inp => {
        counts[inp.dataset.agId] = inp.value;
      });
      const stats = getEntryGenderStats({ counts });
      document.getElementById('pub-live-male').textContent = stats.maleTotal;
      document.getElementById('pub-live-female').textContent = stats.femaleTotal;
      document.getElementById('pub-live-total').textContent = stats.grandTotal;

    function handlePublicFormSubmit(e, categoryId) {
      e.preventDefault();
      const zionId = document.getElementById('pub-zion-select').value;
      const date = document.getElementById('pub-date').value;
      const notes = document.getElementById('pub-notes').value.trim();
      const counts = {};
      document.querySelectorAll('.pub-ag-input').forEach(inp => {
        counts[inp.dataset.agId] = Math.max(0, parseInt(inp.value, 10) || 0);
      });
      const now = new Date().toISOString();
      state.entries.unshift({
        id: `ent-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
        categoryId,
        zionId,
        date,
        notes,
        counts,
        createdAt: now,
        updatedAt: now
      });
      saveState(true);
      state.publicSubmitted = true;
      showToast('Survey response submitted');
      render();
    }

    function exportCategoryCSV(catId) {
      const cat = state.categories.find(c => c.id === catId);
      if (!cat) return;
      const filteredEntries = getFilteredCategoryEntries(catId);
      const headers = ['Category', 'Date', 'Zion', 'Notes', ...state.ageGroups.map(ag => ag.label), 'Male Total', 'Female Total', 'Grand Total'];
      const rows = filteredEntries.map(entry => {
        const zName = state.zions.find(z => z.id === entry.zionId)?.name || 'Unknown';
        const s = getEntryGenderStats(entry);
        return [
          `"${cat.name.replace(/"/g, '""')}"`,
          entry.date,
          `"${zName.replace(/"/g, '""')}"`,
          `"${(entry.notes || '').replace(/"/g, '""')}"`,
          ...state.ageGroups.map(ag => Number(entry.counts?.[ag.id]) || 0),
          s.maleTotal,
          s.femaleTotal,
          s.grandTotal
        ].join(',');
      });
      const csv = [headers.join(','), ...rows].join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${cat.name.toLowerCase().replace(/\s+/g, '_')}_survey_${getTodayISO()}.csv`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('CSV exported successfully');
    }

        state.categories.push({ id: `cat-${Date.now()}`, name, description, color, createdAt: now, updatedAt: now });

        state.categories = state.categories.map(c => c.id === catId ? { ...c, name, description, color, updatedAt: now } : c);

      saveState(true);
      closeModal();

    function confirmDeleteCategory(catId) {
      if (!checkAdminPermission('delete this survey')) return;
      const cat = state.categories.find(c => c.id === catId);
      if (!cat) return;
      openConfirmModal(
        `Delete "${cat.name}"?`,
        `This will permanently remove the "${cat.name}" survey folder and all its recorded entries.`,
        () => {
          if (!state.deletedCategoryIds) state.deletedCategoryIds = [];
          state.deletedCategoryIds.push(catId);
          const removedEntries = state.entries.filter(e => e.categoryId === catId);
          if (!state.deletedEntryIds) state.deletedEntryIds = [];
          removedEntries.forEach(e => state.deletedEntryIds.push(e.id));
          state.categories = state.categories.filter(c => c.id !== catId);
          state.entries = state.entries.filter(e => e.categoryId !== catId);
          if (state.selectedCategoryId === catId) {
            state.route = 'home';
            state.selectedCategoryId = null;
          }
          saveState(true);
          closeModal();
          showToast(`Deleted "${cat.name}"`);
          render();
        }
      );
    }

    function toggleInlineZionInput(action) {
      const box = document.getElementById('inline-zion-editor');
      const modeInp = document.getElementById('inline-zion-mode');
      const textInp = document.getElementById('inline-zion-input');
      const select = document.getElementById('entry-zion-select');
      box.classList.remove('hidden');
      modeInp.value = action;
      if (action === 'edit') {
        const z = state.zions.find(item => item.id === select.value);
        textInp.value = z ? z.name : '';
      } else {
        textInp.value = '';
      }
      textInp.focus();
    }

    function saveInlineZion() {
      if (!checkAdminPermission('add or rename Zions')) return;
      const mode = document.getElementById('inline-zion-mode').value;
      const val = document.getElementById('inline-zion-input').value.trim();
      const select = document.getElementById('entry-zion-select');
      if (!val) return;

      const now = new Date().toISOString();
      if (mode === 'add') {
        const newZ = { id: `zion-${Date.now()}`, name: val, createdAt: now, updatedAt: now };
        state.zions.push(newZ);
        const opt = document.createElement('option');
        opt.value = newZ.id;
        opt.textContent = newZ.name;
        opt.selected = true;
        select.appendChild(opt);
        showToast(`Zion "${val}" added`);
      } else {
        const targetId = select.value;
        state.zions = state.zions.map(z => z.id === targetId ? { ...z, name: val, updatedAt: now } : z);
        const opt = select.querySelector(`option[value="${targetId}"]`);
        if (opt) opt.textContent = val;
        showToast(`Zion renamed to "${val}"`);
      }
      saveState(true);
      document.getElementById('inline-zion-editor').classList.add('hidden');
    }

    function addInlineAgeGroup(mode, entryId) {
      if (!checkAdminPermission('add demographic groups')) return;
      const label = document.getElementById('inline-ag-label').value.trim();
      const groupType = document.getElementById('inline-ag-type').value;
      const gender = document.getElementById('inline-ag-gender').value;
      const includeInGt = document.getElementById('inline-ag-include-gt').checked;
      if (!label) return;
      const now = new Date().toISOString();
      const newId = `ag-${Date.now()}`;
      state.ageGroups.push({ id: newId, label, gender, groupType, createdAt: now, updatedAt: now });
      if (includeInGt) {
        if (!Array.isArray(state.grandTotalGroupIds)) {
          state.grandTotalGroupIds = state.ageGroups.map(ag => ag.id);
        } else if (!state.grandTotalGroupIds.includes(newId)) {
          state.grandTotalGroupIds.push(newId);
        }
      }
      saveState(true);
      openEntryModal(mode, entryId || null);
      showToast(`"${label}" added`);
    }

    function removeInlineAgeGroup(agId, mode, entryId) {
      if (!checkAdminPermission('remove demographic groups')) return;
      if (state.ageGroups.length <= 1) return;
      if (!state.deletedAgIds) state.deletedAgIds = [];
      state.deletedAgIds.push(agId);
      state.ageGroups = state.ageGroups.filter(ag => ag.id !== agId);
      saveState(true);
      openEntryModal(mode, entryId || null);
      showToast('Age group removed');
    }

    function updateModalLiveTotals() {
      const counts = {};
      document.querySelectorAll('.entry-ag-input').forEach(inp => {
        counts[inp.dataset.agId] = inp.value;
      });
      const stats = getEntryGenderStats({ counts });
      document.getElementById('modal-live-male').textContent = stats.maleTotal;
      document.getElementById('modal-live-female').textContent = stats.femaleTotal;
      document.getElementById('modal-live-total').textContent = stats.grandTotal;
    }

    function submitEntryModal(e, mode, entryId) {
      e.preventDefault();
      const zionId = document.getElementById('entry-zion-select').value;
      const date = document.getElementById('entry-date').value;
      const notes = document.getElementById('entry-notes').value.trim();
      const counts = {};
      document.querySelectorAll('.entry-ag-input').forEach(inp => {
        counts[inp.dataset.agId] = Math.max(0, parseInt(inp.value, 10) || 0);
      });

      const now = new Date().toISOString();
      if (mode === 'edit' && entryId) {
        state.entries = state.entries.map(ent => ent.id === entryId ? { ...ent, zionId, date, notes, counts, updatedAt: now } : ent);
        showToast('Survey entry updated');
      } else {
        state.entries.unshift({
          id: `ent-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
          categoryId: state.selectedCategoryId,
          zionId,
          date,
          notes,
          counts,
          createdAt: now,
          updatedAt: now
        });
        showToast('Survey entry saved');
      }
      saveState(true);
      closeModal();
      render();
    }

    function confirmDeleteEntry(entryId) {
      if (!checkAdminPermission('delete this entry')) return;
      openConfirmModal(
        'Delete Survey Entry?',
        'Are you sure you want to delete this survey record? This action cannot be undone.',
        () => {
          if (!state.deletedEntryIds) state.deletedEntryIds = [];
          state.deletedEntryIds.push(entryId);
          state.entries = state.entries.filter(e => e.id !== entryId);
          saveState(true);
          closeModal();
          showToast('Entry deleted');
          render();
        }
      );
    }

    // --- Modal 3: Custom Filter / Search Rule Builder ---
    function openFilterRuleModal(mode, ruleId = null) {
      const rule = ruleId ? state.filters.customRules.find(r => r.id === ruleId) : null;
      const field = rule?.field || 'maleTotal';
      const operator = rule?.operator || '>=';
      const value = rule?.value !== undefined ? String(rule.value) : '10';

      document.getElementById('modal-root').innerHTML = `
        <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-xs">
          <div class="bg-white rounded-2xl border border-slate-200 shadow-2xl w-full max-w-md overflow-hidden animate-fade-in">
            <div class="px-5 py-4 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
              <h3 class="text-base font-bold text-slate-900">${mode === 'add' ? 'Add Custom Filter / Search Rule' : 'Edit Filter Rule'}</h3>
              <button onclick="closeModal()" class="p-1.5 rounded-lg text-slate-400 hover:text-slate-700"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            <form onsubmit="submitFilterRuleModal(event, '${mode}', '${ruleId || ''}')" class="p-5 space-y-4">
              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Target Field</label>

                  <optgroup label="Gender &amp; Grand Totals">
                    <option value="maleTotal" ${field === 'maleTotal' ? 'selected' : ''}>Male Total</option>
                    <option value="femaleTotal" ${field === 'femaleTotal' ? 'selected' : ''}>Female Total</option>
                    <option value="grandTotal" ${field === 'grandTotal' ? 'selected' : ''}>Grand Total</option>
                  </optgroup>
                  <optgroup label="Location &amp; Remarks">
                    <option value="zion" ${field === 'zion' ? 'selected' : ''}>Zion Location</option>
                    <option value="notes" ${field === 'notes' ? 'selected' : ''}>Search / Remarks</option>
                  </optgroup>
                  <optgroup label="Specific Age Groups">
                    ${state.ageGroups.map(ag => `<option value="${ag.id}" ${field === ag.id ? 'selected' : ''}>${escapeHtml(ag.label)}</option>`).join('')}

                </select>
              </div>
              <div id="rule-dynamic-fields"></div>
              <div class="pt-3 border-t border-slate-100 flex justify-end gap-2">
                <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl text-sm font-semibold text-slate-600 hover:bg-slate-100">Cancel</button>
                <button type="submit" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold">${mode === 'add' ? 'Add Filter' : 'Save Filter'}</button>
              </div>
            </form>
          </div>
        </div>
      `;
      lucide.createIcons();
      refreshFilterRuleInputs(operator, value);

    function refreshFilterRuleInputs(presetOp = null, presetVal = null) {
      const field = document.getElementById('rule-field').value;
      const container = document.getElementById('rule-dynamic-fields');

      if (field === 'zion') {
        const op = presetOp || 'equals';
        const val = presetVal || (state.zions[0]?.id || '');
        container.innerHTML = `
          <div class="space-y-4">
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Condition</label>
              <select id="rule-operator" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium text-slate-900">
                <option value="equals" ${op === 'equals' ? 'selected' : ''}>Is</option>
                <option value="not_equals" ${op === 'not_equals' ? 'selected' : ''}>Is Not</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Zion</label>
              <select id="rule-value" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium text-slate-900">
                ${state.zions.map(z => `<option value="${z.id}" ${val === z.id ? 'selected' : ''}>${escapeHtml(z.name)}</option>`).join('')}
              </select>
            </div>
          </div>
        `;
      } else if (field === 'notes') {
        const op = presetOp || 'contains';
        const val = presetVal ?? '';
        container.innerHTML = `
          <div class="space-y-4">
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Condition</label>
              <select id="rule-operator" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium text-slate-900">
                <option value="contains" ${op === 'contains' ? 'selected' : ''}>Contains</option>
                <option value="not_contains" ${op === 'not_contains' ? 'selected' : ''}>Does Not Contain</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Keyword</label>
              <input id="rule-value" type="text" value="${escapeHtml(val)}" placeholder="Enter keyword..." required class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-900" />
            </div>
          </div>
        `;
      } else {
        const op = presetOp || '>=';
        const val = presetVal ?? '10';
        container.innerHTML = `
          <div class="space-y-4">
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Condition</label>
              <select id="rule-operator" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium text-slate-900">
                <option value=">=" ${op === '>=' ? 'selected' : ''}>Greater than or equal (&gt;=)</option>
                <option value="<=" ${op === '<=' ? 'selected' : ''}>Less than or equal (&lt;=)</option>
                <option value=">" ${op === '>' ? 'selected' : ''}>Greater than (&gt;)</option>
                <option value="<" ${op === '<' ? 'selected' : ''}>Less than (&lt;)</option>
                <option value="==" ${op === '==' ? 'selected' : ''}>Equals (==)</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Count Value</label>
              <input id="rule-value" type="number" min="0" value="${escapeHtml(val)}" required class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-slate-900" />
            </div>
          </div>
        `;
      }

    function submitFilterRuleModal(e, mode, ruleId) {
      e.preventDefault();
      const field = document.getElementById('rule-field').value;
      const operator = document.getElementById('rule-operator').value;
      const value = document.getElementById('rule-value').value;
      if (String(value).trim() === '') return;

      if (mode === 'add') {
        state.filters.customRules.push({ id: `rule-${Date.now()}`, field, operator, value, enabled: true });
        showToast('Custom filter rule added');
      } else if (ruleId) {
        state.filters.customRules = state.filters.customRules.map(r => r.id === ruleId ? { ...r, field, operator, value } : r);
        showToast('Custom filter rule updated');
      }
      closeModal();
      render();
    }

    function addManagedZion(e) {
      e.preventDefault();
      if (!checkAdminPermission('add a new Zion')) return;
      const val = document.getElementById('manage-new-zion').value.trim();
      if (!val) return;
      const now = new Date().toISOString();
      state.zions.push({ id: `zion-${Date.now()}`, name: val, createdAt: now, updatedAt: now });
      saveState(true);
      openManageFieldsModal();
      showToast(`Zion "${val}" added`);
    }

    function promptRenameZion(id) {
      if (!checkAdminPermission('rename Zions')) return;
      const z = state.zions.find(item => item.id === id);
      if (!z) return;
      document.getElementById('modal-root').innerHTML = `
        <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-xs">
          <div class="bg-white rounded-2xl border border-slate-200 shadow-2xl w-full max-w-sm p-5 space-y-4">
            <h3 class="text-base font-bold text-slate-900">Rename Zion</h3>
            <input id="rename-zion-val" type="text" value="${escapeHtml(z.name)}" autofocus class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold" />
            <div class="flex justify-end gap-2">
              <button onclick="openManageFieldsModal()" class="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-100 text-slate-700">Cancel</button>
              <button onclick="saveRenamedZion('${id}')" class="px-4 py-2 rounded-xl text-xs font-semibold bg-indigo-600 text-white">Save</button>
            </div>
          </div>
        </div>
      `;
    }

    function saveRenamedZion(id) {
      if (!checkAdminPermission('rename Zions')) return;
      const val = document.getElementById('rename-zion-val').value.trim();
      if (!val) return;
      const now = new Date().toISOString();
      state.zions = state.zions.map(z => z.id === id ? { ...z, name: val, updatedAt: now } : z);
      saveState(true);
      openManageFieldsModal();
      showToast('Zion updated');
    }

    function deleteManagedZion(id) {
      if (!checkAdminPermission('delete Zions')) return;
      if (state.zions.length <= 1) return;
      if (!state.deletedZionIds) state.deletedZionIds = [];
      state.deletedZionIds.push(id);
      state.zions = state.zions.filter(z => z.id !== id);
      saveState(true);
      openManageFieldsModal();
      showToast('Zion removed');
    }

    function addManagedAgeGroup(e) {
      e.preventDefault();
      if (!checkAdminPermission('add demographic groups')) return;
      const label = document.getElementById('manage-new-ag').value.trim();
      const groupType = document.getElementById('manage-new-ag-type').value;
      const gender = document.getElementById('manage-new-ag-gender').value;
      const includeInGt = document.getElementById('manage-new-ag-include-gt').checked;
      if (!label) return;
      const now = new Date().toISOString();
      const newId = `ag-${Date.now()}`;
      state.ageGroups.push({ id: newId, label, gender, groupType, createdAt: now, updatedAt: now });
      if (includeInGt) {
        if (!Array.isArray(state.grandTotalGroupIds)) {
          state.grandTotalGroupIds = state.ageGroups.map(ag => ag.id);
        } else if (!state.grandTotalGroupIds.includes(newId)) {
          state.grandTotalGroupIds.push(newId);
        }
      }
      saveState(true);
      openManageFieldsModal();
      showToast(`"${label}" added as ${groupType === 'other' ? 'Other' : 'Age group'}`);
    }

    function promptRenameAgeGroup(id) {
      if (!checkAdminPermission('edit demographic groups')) return;
      const ag = state.ageGroups.find(item => item.id === id);
      if (!ag) return;
      const g = ag.gender || inferGenderFromLabel(ag.label);
      const t = getGroupType(ag);
      const inGt = getGrandTotalGroupIds().includes(id);

      document.getElementById('modal-root').innerHTML = `
        <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-xs">
          <div class="bg-white rounded-2xl border border-slate-200 shadow-2xl w-full max-w-sm p-5 space-y-4 animate-fade-in">
            <h3 class="text-base font-bold text-slate-900">Edit Demographic Group</h3>
            <div>
              <label class="block text-[11px] font-semibold text-slate-500 mb-1">Group Label</label>
              <input id="rename-ag-val" type="text" value="${escapeHtml(ag.label)}" autofocus class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold" />
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-[11px] font-semibold text-slate-500 mb-1">Type</label>
                <select id="rename-ag-type" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold">
                  <option value="age_group" ${t === 'age_group' ? 'selected' : ''}>Age group</option>
                  <option value="other" ${t === 'other' ? 'selected' : ''}>Other</option>
                </select>
              </div>
              <div>
                <label class="block text-[11px] font-semibold text-slate-500 mb-1">Gender</label>
                <select id="rename-ag-gender" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold">
                  <option value="male" ${g === 'male' ? 'selected' : ''}>Male</option>
                  <option value="female" ${g === 'female' ? 'selected' : ''}>Female</option>
                  <option value="other" ${g === 'other' ? 'selected' : ''}>Other / Neutral</option>
                </select>
              </div>
            </div>
            <div class="flex items-center gap-2 pt-1">
              <input id="rename-ag-include-gt" type="checkbox" ${inGt ? 'checked' : ''} class="w-4 h-4 rounded text-indigo-600 border-slate-300" />
              <label for="rename-ag-include-gt" class="text-xs font-semibold text-slate-700">Include in Grand Total</label>
            </div>
            <div class="flex justify-end gap-2 pt-2">
              <button onclick="openManageFieldsModal()" class="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-100 text-slate-700">Cancel</button>
              <button onclick="saveRenamedAgeGroup('${id}')" class="px-4 py-2 rounded-xl text-xs font-semibold bg-emerald-600 text-white">Save</button>
            </div>
          </div>
        </div>
      `;
    }

    function saveRenamedAgeGroup(id) {
      if (!checkAdminPermission('edit demographic groups')) return;
      const label = document.getElementById('rename-ag-val').value.trim();
      const groupType = document.getElementById('rename-ag-type').value;
      const gender = document.getElementById('rename-ag-gender').value;
      const includeInGt = document.getElementById('rename-ag-include-gt').checked;
      if (!label) return;
      const now = new Date().toISOString();
      state.ageGroups = state.ageGroups.map(ag => ag.id === id ? { ...ag, label, gender, groupType, updatedAt: now } : ag);
      
      const currentGt = getGrandTotalGroupIds();
      if (includeInGt && !currentGt.includes(id)) {
        state.grandTotalGroupIds = [...currentGt, id];
      } else if (!includeInGt && currentGt.includes(id)) {
        state.grandTotalGroupIds = currentGt.filter(item => item !== id);
      }
      saveState(true);
      openManageFieldsModal();
      showToast('Group updated');
    }

    function openGrandTotalSelectorModal() {
      const currentSelected = getGrandTotalGroupIds();
      const ageGroupItems = state.ageGroups.filter(ag => getGroupType(ag) === 'age_group');
      const otherItems = state.ageGroups.filter(ag => getGroupType(ag) === 'other');

      document.getElementById('modal-root').innerHTML = `
        <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-xs">
          <div class="bg-white rounded-2xl border border-slate-200 shadow-2xl w-full max-w-md overflow-hidden animate-fade-in">
            <div class="px-5 py-4 bg-indigo-50/60 border-b border-indigo-100 flex items-center justify-between">
              <div class="flex items-center gap-2.5">
                <div class="w-8 h-8 rounded-lg bg-indigo-600 text-white flex items-center justify-center">
                  <i data-lucide="calculator" class="w-4 h-4"></i>
                </div>
                <div>
                  <h3 class="text-sm font-bold text-slate-900">Grand Total Group Selection</h3>
                  <p class="text-[11px] text-slate-500">Choose which age groups count towards Grand Total</p>
                </div>
              </div>
              <button onclick="closeModal()" class="p-1 rounded-lg text-slate-400 hover:text-slate-600">
                <i data-lucide="x" class="w-4 h-4"></i>

            <div class="p-5 space-y-4 max-h-[68vh] overflow-y-auto">
              <!-- Presets -->
              <div class="flex items-center justify-between gap-2 p-2.5 rounded-xl bg-slate-50 border border-slate-200 text-xs">
                <span class="font-bold text-slate-600">Quick Presets:</span>
                <div class="flex items-center gap-1.5">
                  <button type="button" onclick="setGrandTotalPreset('all')" class="px-2.5 py-1 rounded-lg bg-white border border-slate-200 hover:bg-indigo-50 text-indigo-700 font-semibold shadow-2xs">All</button>
                  <button type="button" onclick="setGrandTotalPreset('age_only')" class="px-2.5 py-1 rounded-lg bg-white border border-slate-200 hover:bg-emerald-50 text-emerald-700 font-semibold shadow-2xs">Age Groups Only</button>
                  <button type="button" onclick="setGrandTotalPreset('none')" class="px-2.5 py-1 rounded-lg bg-white border border-slate-200 hover:bg-rose-50 text-rose-700 font-semibold shadow-2xs">Clear</button>
                </div>
              </div>

              <!-- Age Groups Section -->
              <div>
                <span class="block text-[11px] font-bold uppercase tracking-wider text-emerald-700 mb-2 flex items-center gap-1">
                  <i data-lucide="users" class="w-3.5 h-3.5"></i>
                  <span>Age Groups (${ageGroupItems.length})</span>
                </span>
                <div class="space-y-1.5">
                  ${ageGroupItems.map(ag => `
                    <label class="flex items-center justify-between p-2.5 rounded-xl border border-slate-200/80 hover:bg-slate-50 cursor-pointer transition-colors">
                      <div class="flex items-center gap-2.5 min-w-0">
                        <input type="checkbox" value="${ag.id}" class="gt-ag-checkbox w-4 h-4 rounded text-indigo-600 border-slate-300 focus:ring-indigo-500" ${currentSelected.includes(ag.id) ? 'checked' : ''} />
                        <span class="text-xs font-semibold text-slate-800 truncate">${escapeHtml(ag.label)}</span>
                      </div>
                      <span class="text-[10px] font-bold uppercase px-1.5 py-0.5 rounded ${ag.gender === 'male' ? 'bg-sky-100 text-sky-700' : ag.gender === 'female' ? 'bg-rose-100 text-rose-700' : 'bg-slate-100 text-slate-600'}">${ag.gender}</span>
                    </label>
                  `).join('')}
                  ${ageGroupItems.length === 0 ? '<p class="text-xs text-slate-400 italic">No age groups configured.</p>' : ''}
                </div>
              </div>

              <!-- Other Groups Section -->
              ${otherItems.length > 0 ? `
                <div>
                  <span class="block text-[11px] font-bold uppercase tracking-wider text-amber-700 mb-2 flex items-center gap-1">
                    <i data-lucide="folder" class="w-3.5 h-3.5"></i>
                    <span>Other Groups (${otherItems.length})</span>
                  </span>
                  <div class="space-y-1.5">
                    ${otherItems.map(ag => `
                      <label class="flex items-center justify-between p-2.5 rounded-xl border border-slate-200/80 hover:bg-slate-50 cursor-pointer transition-colors">
                        <div class="flex items-center gap-2.5 min-w-0">
                          <input type="checkbox" value="${ag.id}" class="gt-ag-checkbox w-4 h-4 rounded text-indigo-600 border-slate-300 focus:ring-indigo-500" ${currentSelected.includes(ag.id) ? 'checked' : ''} />
                          <span class="text-xs font-semibold text-slate-800 truncate">${escapeHtml(ag.label)}</span>
                        </div>
                        <span class="text-[10px] font-bold uppercase px-1.5 py-0.5 rounded bg-amber-100 text-amber-700">Other</span>
                      </label>
                    `).join('')}
                  </div>
                </div>
              ` : ''}
            </div>

            <div class="px-5 py-3.5 bg-slate-50 border-t border-slate-200 flex items-center justify-between">
              <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-200 cursor-pointer">Cancel</button>
              ${state.isAdmin ? `
                <button type="button" onclick="saveGrandTotalSelection()" class="px-5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold shadow-xs cursor-pointer">Apply Selection</button>
              ` : `
                <button type="button" onclick="openAdminLoginModal()" class="px-4 py-2 rounded-xl bg-amber-600 hover:bg-amber-700 text-white text-xs font-semibold flex items-center gap-1.5 cursor-pointer"><i data-lucide="lock" class="w-3.5 h-3.5"></i><span>Admin Login to Apply</span></button>
              `}
            </div>
          </div>
        </div>
      `;
      lucide.createIcons();
    }

    function saveGrandTotalSelection() {
      if (!checkAdminPermission('modify Grand Total settings')) return;
      const checkboxes = document.querySelectorAll('.gt-ag-checkbox');
      const selected = [];
      checkboxes.forEach(cb => {
        if (cb.checked) selected.push(cb.value);
      });
      if (selected.length === 0) {
        showToast('Please select at least one group for Grand Total', 'error');
        return;
      }
      state.grandTotalGroupIds = selected;
      saveState(true);
      closeModal();
      render();
      showToast(`Grand Total updated (${selected.length} groups selected)`);
    }

    function setGrandTotalPreset(preset) {
      const checkboxes = document.querySelectorAll('.gt-ag-checkbox');
      checkboxes.forEach(cb => {
        const ag = state.ageGroups.find(item => item.id === cb.value);
        const type = getGroupType(ag);
        if (preset === 'all') {
          cb.checked = true;
        } else if (preset === 'age_only') {
          cb.checked = (type === 'age_group');
        } else if (preset === 'none') {
          cb.checked = false;
        }
      });
    }

    function deleteManagedAgeGroup(id) {
      if (!checkAdminPermission('delete demographic groups')) return;
      if (state.ageGroups.length <= 1) return;
      if (!state.deletedAgIds) state.deletedAgIds = [];
      state.deletedAgIds.push(id);
      state.ageGroups = state.ageGroups.filter(ag => ag.id !== id);
      saveState(true);
      openManageFieldsModal();
      showToast('Age group removed');
    }

              </button>
            </div>

            <form onsubmit="handleAdminLoginSubmit(event)" class="p-6 space-y-4">
              <div id="admin-login-error" class="hidden p-3 rounded-xl bg-rose-50 border border-rose-200 text-xs font-semibold text-rose-700 flex items-center gap-2">
                <i data-lucide="alert-circle" class="w-4 h-4 text-rose-500 shrink-0"></i>
                <span id="admin-login-error-text">Invalid Admin ID or Password</span>
              </div>

              <div>
                <label for="admin-id-input" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">Admin ID</label>
                <div class="relative">
                  <input id="admin-id-input" type="text" autocomplete="username" placeholder="Enter Admin ID" required autofocus class="w-full pl-9 pr-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-900 focus:bg-white focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 transition-all" />

              <div>
                <label for="admin-pass-input" class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1.5">Password</label>
                <div class="relative">
                  <input id="admin-pass-input" type="password" autocomplete="current-password" placeholder="Enter Password" required class="w-full pl-9 pr-10 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-semibold text-slate-900 focus:bg-white focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 transition-all" />
                  <i data-lucide="lock" class="w-4 h-4 text-slate-400 absolute left-3 top-3"></i>
                  <button type="button" onclick="toggleAdminPasswordVisibility()" class="p-1 text-slate-400 hover:text-slate-600 absolute right-2.5 top-2.5 cursor-pointer">
                    <i id="admin-pass-eye" data-lucide="eye" class="w-4 h-4"></i>
                  </button>
                </div>
              </div>

              <div class="pt-2 flex items-center justify-end gap-2">
                <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-100 cursor-pointer">Cancel</button>
                <button type="submit" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold shadow-xs flex items-center gap-2 cursor-pointer">
                  <i data-lucide="log-in" class="w-3.5 h-3.5"></i>
                  <span>Sign In</span>
                </button>
              </div>
            </form>
          </div>
        </div>
      `;
      lucide.createIcons();
      setTimeout(() => {
        const idInp = document.getElementById('admin-id-input');
        if (idInp) idInp.focus();
      }, 50);
    }

    function toggleAdminPasswordVisibility() {
      const passInp = document.getElementById('admin-pass-input');
      const eyeIcon = document.getElementById('admin-pass-eye');
      if (!passInp) return;
      if (passInp.type === 'password') {
        passInp.type = 'text';
        if (eyeIcon) eyeIcon.setAttribute('data-lucide', 'eye-off');
      } else {
        passInp.type = 'password';
        if (eyeIcon) eyeIcon.setAttribute('data-lucide', 'eye');
      }
      lucide.createIcons();
    }

    function handleAdminLoginSubmit(e) {
      e.preventDefault();
      const idInp = document.getElementById('admin-id-input');
      const passInp = document.getElementById('admin-pass-input');
      const errBox = document.getElementById('admin-login-error');
      const errText = document.getElementById('admin-login-error-text');

      const enteredId = idInp ? idInp.value.trim() : '';
      const enteredPass = passInp ? passInp.value : '';

      if (enteredId === ADMIN_ID && enteredPass === ADMIN_PASSWORD) {
        state.isAdmin = true;
        try {
          localStorage.setItem(ADMIN_SESSION_KEY, 'true');
        } catch (err) {
          console.warn('LocalStorage admin write failed:', err);
        }
        closeModal();
        render();
        showToast('Logged in as Administrator (surya11008)');
      } else {
        if (errBox) {
          errBox.classList.remove('hidden');
          if (errText) errText.textContent = 'Incorrect Admin ID or Password. Please try again.';
          lucide.createIcons();
        }
        if (passInp) {
          passInp.value = '';
          passInp.focus();
        }
      }
    }

    function handleAdminLogout() {
      state.isAdmin = false;
      try {
        localStorage.removeItem(ADMIN_SESSION_KEY);
      } catch (err) {
        console.warn('LocalStorage admin remove failed:', err);
      }
      render();
      showToast('Logged out of Admin Mode');
    }

    window.openAdminLoginModal = openAdminLoginModal;
    window.handleAdminLoginSubmit = handleAdminLoginSubmit;
    window.toggleAdminPasswordVisibility = toggleAdminPasswordVisibility;
    window.handleAdminLogout = handleAdminLogout;
    window.setHomeView = setHomeView;

    // ============================================================================
    // BOOTSTRAP APPLICATION
    // ============================================================================
    window.addEventListener('hashchange', syncFromHash);
    window.onload = function () {
      loadState();
      syncFromHash();
      render();
    };
  </script>

  <!-- Firebase Initialization & Cloud Sync -->
  <script type="module">
    // Import the functions you need from the SDKs you need
    import { initializeApp } from "firebase/app";
    import { getAnalytics, isSupported } from "firebase/analytics";
    import { getFirestore, doc, setDoc, onSnapshot } from "firebase/firestore";
    import { getAuth, signInAnonymously } from "firebase/auth";

    // Your web app's Firebase configuration
    // For Firebase JS SDK v7.20.0 and later, measurementId is optional
    const firebaseConfig = {
      apiKey: "AIzaSyB0ZL4r72-G6XCapKvjA-cbOWJbjC9dNuI",
      authDomain: "sni-org-in.firebaseapp.com",
      projectId: "sni-org-in",
      storageBucket: "sni-org-in.firebasestorage.app",
      messagingSenderId: "717850324141",
      appId: "1:717850324141:web:17280789950030ea386a24",
      measurementId: "G-L3XR047S9Q"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    let analytics = null;
    isSupported().then(supported => {
      if (supported) analytics = getAnalytics(app);
    }).catch(() => {});

    const db = getFirestore(app);
    const auth = getAuth(app);

    window.firebaseApp = app;
    window.firebaseAnalytics = analytics;
    window.firebaseDb = db;
    window.firebaseAuth = auth;

    const syncEl = document.getElementById('cloud-sync-status');
    const updateSyncBadge = (status, text) => {
      if (!syncEl) return;
      if (status === 'synced') {
        syncEl.className = 'cursor-pointer inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl bg-emerald-50 text-emerald-700 border border-emerald-200 text-xs font-semibold transition-colors hover:bg-emerald-100';
        syncEl.innerHTML = '<i data-lucide="cloud-check" class="w-3.5 h-3.5 text-emerald-600"></i><span class="hidden md:inline">' + (text || 'Firebase Synced') + '</span>';
      } else if (status === 'syncing') {
        syncEl.className = 'cursor-pointer inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl bg-amber-50 text-amber-700 border border-amber-200 text-xs font-semibold transition-colors hover:bg-amber-100';
        syncEl.innerHTML = '<i data-lucide="refresh-cw" class="w-3.5 h-3.5 text-amber-600 animate-spin"></i><span class="hidden md:inline">Syncing...</span>';
      } else if (status === 'error') {
        syncEl.className = 'cursor-pointer inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl bg-slate-100 text-slate-600 text-xs font-medium transition-colors hover:bg-slate-200';
        syncEl.innerHTML = '<i data-lucide="cloud-off" class="w-3.5 h-3.5 text-slate-500"></i><span class="hidden md:inline">' + (text || 'Local Mode') + '</span>';
      }
      if (window.lucide) lucide.createIcons();
    };

    signInAnonymously(auth).catch(err => {
      console.log('Firebase auth:', err.message);
    });

    const docRef = doc(db, 'survey_attendance_data', 'global_state');
    let isRemoteUpdate = false;
    let syncTimer = null;

    try {
      onSnapshot(docRef, (docSnap) => {
        if (docSnap.exists()) {
          const data = docSnap.data();
          isRemoteUpdate = true;
          try {
            if (typeof window.reconcileWithRemote === 'function') {
              window.reconcileWithRemote(data);
            }
          } catch (e) {
            console.error('Reconciliation error:', e);
          }
          if (typeof render === 'function') render();
          updateSyncBadge('synced', 'Firebase Live');
          setTimeout(() => { isRemoteUpdate = false; }, 200);
        } else {
          updateSyncBadge('syncing');
          if (typeof window.syncToCloud === 'function') {
            window.syncToCloud(true);
          }
        }
      }, (error) => {
        console.warn('Firestore listener error:', error);
        updateSyncBadge('error', 'Local Storage');
      });
    } catch (err) {
      console.warn('Firestore snapshot error:', err);
      updateSyncBadge('error', 'Local Storage');
    }

    window.syncToCloud = function(immediate = false) {
      if (isRemoteUpdate) return;
      updateSyncBadge('syncing');
      clearTimeout(syncTimer);

      const doSync = async () => {
        try {
          const payload = {
            categories: state.categories,
            zions: state.zions,
            ageGroups: state.ageGroups,
            entries: state.entries,
            grandTotalGroupIds: state.grandTotalGroupIds,
            deletedCategoryIds: (state.deletedCategoryIds || []).slice(-300),
            deletedEntryIds: (state.deletedEntryIds || []).slice(-500),
            deletedZionIds: (state.deletedZionIds || []).slice(-200),
            deletedAgIds: (state.deletedAgIds || []).slice(-200),
            updatedAt: new Date().toISOString()
          };
          await setDoc(docRef, payload, { merge: true });
          updateSyncBadge('synced', 'Firebase Live');
        } catch (e) {
          console.warn('Cloud save error:', e);
          updateSyncBadge('error', 'Saved Locally');
        }
      };

      if (immediate) {
        doSync();
      } else {
        syncTimer = setTimeout(doSync, 400);
      }
    };
  </script>
